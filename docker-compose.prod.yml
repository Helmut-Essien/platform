# Full stack for a free lab VM (API + Blazor UI + Postgres + Redis).
# Usage on the server:
#   cp .env.example .env   # then edit secrets
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: platform-api:latest
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:80
      ConnectionStrings__DefaultConnection: >-
        Host=postgres;Port=5432;Database=platform_db;Username=platform;Password=${POSTGRES_PASSWORD}
      Jwt__Issuer: Platform.Api
      Jwt__Audience: Platform.Client
      Jwt__Key: ${JWT_KEY}
      Jwt__ExpiryMinutes: "60"
      AdminSeed__Email: ${ADMIN_EMAIL}
      AdminSeed__Password: ${ADMIN_PASSWORD}
      Redis__ConnectionString: redis:6379
      # Production checklist: set Email__Provider to Smtp or Resend (not Logging),
      # Email__FromAddress, provider credentials, and CORS_ORIGINS / Cors__Origins__0
      # when the UI is not same-origin with the API.
      Email__Provider: Logging
      Email__Outbox__EncryptionKey: ${EMAIL_OUTBOX_ENCRYPTION_KEY}
      # Cors__Origins__0: https://admin.example.com
      # Auth__ClientBaseUrl: https://admin.example.com
    ports:
      - "80:80"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: platform_db
    volumes:
      - platform_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  platform_pgdata:
