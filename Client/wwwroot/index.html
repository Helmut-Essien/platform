<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#10150c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>HelmutCode Admin</title>
    <base href="/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link href="Client.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <div class="app-splash" role="status" aria-live="polite" aria-busy="true">
            <img src="images/login-logo.png"
                 alt="HelmutCode"
                 class="app-splash-logo"
                 width="88"
                 height="88"
                 onerror="this.onerror=null;this.src='favicon.png';" />
            <div class="app-splash-progress" aria-hidden="true">
                <div class="app-splash-progress-fill"></div>
            </div>
            <p class="app-splash-status">
                <span class="loading-progress-text"></span>
            </p>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script>
        window.platformDownloadText = (filename, text) => {
            const blob = new Blob([text], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = filename;
            link.click();
            URL.revokeObjectURL(url);
        };

        // #region agent log
        window.platformShellDebugLog = (message, data, hypothesisId) => {
            fetch('http://127.0.0.1:7855/ingest/0a148943-1fff-4cc8-a446-6d5a47b4f1af', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-Debug-Session-Id': '8992ff' },
                body: JSON.stringify({
                    sessionId: '8992ff',
                    location: 'index.html:platformShell',
                    message,
                    data: data || {},
                    hypothesisId: hypothesisId || 'nav',
                    timestamp: Date.now(),
                    runId: 'sidebar-redesign'
                })
            }).catch(() => {});
        };
        // #endregion

        window.platformShell = {
            isNavOverlay: () => window.matchMedia('(max-width: 1023.98px)').matches,
            isMobileNav: () => window.matchMedia('(max-width: 767.98px)').matches,
            isTabletNav: () => {
                const mq = window.matchMedia('(min-width: 768px) and (max-width: 1023.98px)');
                return mq.matches;
            },
            isDesktopNav: () => window.matchMedia('(min-width: 1024px)').matches,
            blurNavFocus: () => {
                const active = document.activeElement;
                if (active && typeof active.blur === 'function')
                    active.blur();
            },
            collapseRailAfterNav: () => {
                if (!platformShell.isDesktopNav())
                    return;
                const rail = document.querySelector('.platform-sidebar-rail');
                if (rail)
                    rail.classList.add('platform-sidebar-rail--collapsed');
            },
            initDesktopRail: () => {
                const rail = document.querySelector('.platform-sidebar-rail');
                if (!rail || rail.dataset.railInit === '1')
                    return;
                rail.dataset.railInit = '1';
                rail.addEventListener('mouseleave', () => {
                    rail.classList.remove('platform-sidebar-rail--collapsed');
                });
            },
            _escapeHandler: null,
            _cmdKHandler: null,
            _resizeHandler: null,
            _dotNetRef: null,
            syncNavMode: () => {
                const desktop = platformShell.isDesktopNav();
                document.body.classList.toggle('nav-desktop', desktop);
                document.body.classList.toggle('nav-overlay', !desktop);
                if (platformShell._dotNetRef) {
                    platformShell._dotNetRef.invokeMethodAsync('SyncDrawerFromViewport', desktop);
                }
            },
            registerNavShell: (dotNetRef) => {
                platformShell._dotNetRef = dotNetRef;
                platformShell._escapeHandler = (e) => {
                    if (e.key === 'Escape' && platformShell.isNavOverlay()) {
                        platformShellDebugLog('escapeCloseOverlayDrawer', { key: e.key }, 'H4');
                        dotNetRef.invokeMethodAsync('CloseDrawerFromEscape');
                    }
                };
                platformShell._resizeHandler = () => platformShell.syncNavMode();
                document.addEventListener('keydown', platformShell._escapeHandler);
                window.addEventListener('resize', platformShell._resizeHandler);
                platformShell.syncNavMode();
                platformShell.initDesktopRail();
                platformShellDebugLog('navShellRegistered', { width: window.innerWidth }, 'H4');
            },
            unregisterNavShell: () => {
                if (platformShell._escapeHandler) {
                    document.removeEventListener('keydown', platformShell._escapeHandler);
                    platformShell._escapeHandler = null;
                }
                if (platformShell._resizeHandler) {
                    window.removeEventListener('resize', platformShell._resizeHandler);
                    platformShell._resizeHandler = null;
                }
                platformShell._dotNetRef = null;
                document.body.classList.remove('nav-desktop', 'nav-overlay');
            },
            logSidebarLayout: () => {
                const sidebar = document.querySelector('.platform-sidebar');
                const main = document.querySelector('.platform-main-content');
                platformShellDebugLog('sidebarLayout', {
                    width: window.innerWidth,
                    overlay: platformShell.isNavOverlay(),
                    desktop: platformShell.isDesktopNav(),
                    sidebarWidth: sidebar ? sidebar.getBoundingClientRect().width : null,
                    mainMarginLeft: main ? getComputedStyle(main).marginLeft : null
                }, 'H1');
            }
        };

        window.addEventListener('load', () => {
            platformShell.logSidebarLayout();
            platformShell.initDesktopRail();
            window.addEventListener('resize', () => platformShell.logSidebarLayout());
        });
    </script>
</body>

</html>
